<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>¡Feliz Cumpleaños Rosalinda!</title>

    <style>
        /* =====================================================
           CONFIGURACIÓN FÁCIL DE IMÁGENES
           ===================================================== */

        :root {

            /* Tamaño del logo principal */
            --tamano-logo: 100%;

            /* Tamaño de las dos photocards */
            --tamano-photocard: 100%;

            /* Tamaño del número 2 */
            --tamano-numero: 170px;

            /* Espacio entre las photocards */
            --espacio-fotos: 30px;

            /* =================================================
               COLORES
               ================================================= */

            --rosa: #e83f91;
            --rosa-claro: #ffe5f1;
            --rosa-suave: #fff3f8;

            --verde: #74b94b;
            --amarillo: #ffd95a;

            --texto: #70445a;
            --blanco: #ffffff;
        }


        /* =====================================================
           CONFIGURACIÓN GENERAL
           ================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;

            background-color: #02211e;

            font-family: "Trebuchet MS", Arial, sans-serif;

            background-image: url("fondo.jpeg");

            background-size: 100% auto;

            background-position: top center;

            background-repeat: repeat-y;

            background-attachment: scroll;

            color: var(--texto);

            min-height: 100vh;

            overflow-x: hidden;

            /* IMPORTANTE */
            width: 100%;

            display: flex;

            justify-content: center;
        }


        /* =====================================================
           CONTENEDOR PRINCIPAL
           ===================================================== */

        .invitacion {
            width: 100%;
            max-width: 650px;

            margin: 0 auto;

            padding: 25px 18px 50px;

            text-align: center;

            position: relative;
        }



        /* =====================================================
           DECORACIÓN SUPERIOR
           ===================================================== */

        .decoracion-superior {
            font-size: 28px;
            letter-spacing: 10px;

            margin-bottom: 8px;

            animation: flotar 3s ease-in-out infinite;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo-container {
            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 20px;
        }

        .logo {

            width: var(--tamano-logo);

            max-width: 580px;

            height: auto;

            display: block;
        }


        /* =====================================================
           PHOTOCARDS
           ===================================================== */

        .photocards {
            display: grid;

            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: var(--espacio-fotos);

            width: 100%;
            max-width: 100%;

            margin: 10px auto 30px;
        }

        .photocard {
            width: var(--tamano-photocard);

            margin: auto;

            background: transparent;

            padding: 0;

            border: none;

            box-shadow: none;

            transform: rotate(-2deg);

            transition: transform 0.3s ease;
        }

        .photocard:nth-child(2) {
            transform: rotate(2deg);
        }

        .photocard:hover {
            transform: rotate(0deg) scale(1.02);
        }


        /* Imagen real */
        .photocard img {

            width: 100%;

            height: auto;

            display: block;

            border-radius: 12px;
        }


        /* =====================================================
           TEXTO DE INVITACIÓN
           ===================================================== */

        .frase {
            font-size: 22px;
            line-height: 1.4;
            font-weight: bold;

            margin: 15px 10px 12px;

            color: var(--texto);

            /* Fondo semitransparente */
            background: rgba(255, 255, 255, 0.88);

            /* Bordes redondeados */
            border-radius: 18px;

            /* Espacio interno */
            padding: 14px 18px;

            /* Borde */
            border: 2px solid #ffe0ed;

            /* Sombra */
            box-shadow:
                0 5px 12px rgba(120, 70, 90, 0.12);
        }

        .frase span {
            color: var(--rosa);
        }


        /* =====================================================
           NÚMERO 2
           ===================================================== */

        .numero-container {

            margin: 5px auto 25px;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .numero {

            width: var(--tamano-numero);

            height: auto;

            display: block;
        }


        /* =====================================================
           INFORMACIÓN DEL EVENTO
           ===================================================== */

        .informacion {

            display: flex;

            flex-direction: column;

            gap: 12px;

            margin-top: 15px;
        }


        .dato {

            display: flex;

            align-items: center;

            text-align: left;

            background: rgba(255, 255, 255, 0.88);

            border-radius: 18px;

            padding: 15px 18px;

            box-shadow:
                0 5px 12px rgba(120, 70, 90, 0.12);

            border: 2px solid #ffe0ed;

        }


        .dato-icono {

            font-size: 30px;

            width: 48px;

            text-align: center;

            margin-right: 10px;
        }


        .dato-texto {

            display: flex;

            flex-direction: column;
        }


        .dato-titulo {

            font-size: 13px;

            font-weight: bold;

            text-transform: uppercase;

            color: var(--rosa);

            letter-spacing: 1px;
        }


        .dato-info {

            font-size: 17px;

            font-weight: bold;

            margin-top: 2px;
        }


        /* =====================================================
           BOTÓN DEL MAPA
           ===================================================== */

        .boton-mapa {

            display: inline-block;

            margin-top: 8px;

            padding: 8px 14px;

            border-radius: 20px;

            background: var(--rosa);

            color: white;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            transition: 0.2s;
        }

        .boton-mapa:hover {
            transform: scale(1.04);

            background: #d72f7f;
        }


        /* =====================================================
           MENSAJE FINAL
           ===================================================== */

        .mensaje-final {

            margin-top: 35px;

            background: #ffffff;

            border-radius: 25px;

            padding: 22px 18px;

            box-shadow:
                0 7px 15px rgba(120, 70, 90, 0.13);

            border: 3px dashed #f4a5c6;
        }


        .mensaje-final h2 {

            color: var(--rosa);

            font-size: 25px;

            margin-bottom: 8px;
        }

        .mensaje-final p {

            font-size: 16px;

            line-height: 1.5;
        }


        /* =====================================================
           DECORACIÓN INFERIOR
           ===================================================== */

        .decoracion-inferior {

            margin-top: 25px;

            font-size: 28px;

            letter-spacing: 8px;
        }

        /* =====================================================
   IMAGEN FINAL
   ===================================================== */

        .imagen-final {
            width: 100%;
            max-width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 30px auto 20px;
            padding: 0;

            box-sizing: border-box;

            overflow: hidden;
        }

        .imagen-final img {
            display: block;

            width: 700px;
            max-width: 85%;

            height: auto;

            margin: 0 auto;
            padding: 0;

            box-sizing: border-box;
        }

        #boton-musica {
            position: fixed;

            top: 15px;
            right: 15px;

            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.9);

            box-shadow:
                0 4px 10px rgba(120, 70, 90, 0.2);

            font-size: 23px;

            cursor: pointer;

            z-index: 1000;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: transform 0.2s ease;
        }

        #boton-musica:hover {
            transform: scale(1.08);
        }


        /* =====================================================
           ANIMACIÓN
           ===================================================== */

        @keyframes flotar {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

        }


        /* =====================================================
           AJUSTES PARA CELULARES MUY PEQUEÑOS
           ===================================================== */

        @media (max-width: 380px) {

            .invitacion {
                padding-left: 12px;
                padding-right: 12px;
            }

            .frase {
                font-size: 19px;
            }

            .dato-info {
                font-size: 15px;
            }

            .dato-icono {
                font-size: 26px;
                width: 40px;
            }



        }
    </style>
</head>


<body>
    <audio id="musica" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <button id="boton-musica" aria-label="Reproducir música">
        🎵
    </button>

    <main class="invitacion">


        <!-- =================================================
             DECORACIÓN
             ================================================= -->

        <div class="decoracion-superior">
            🌸 🌿 🌸
        </div>


        <!-- =================================================
             LOGO PRINCIPAL
             
             CAMBIAR:
             logo.png
             por el nombre de tu archivo
             ================================================= -->

        <div class="logo-container">

            <!-- Por ahora usamos un emoji -->
            <div style="font-size: 90px;">
                <img src="logo.png" class="logo" alt="Feliz Cumpleaños Rosalinda">
            </div>

        </div>

        <!-- =================================================
             DOS PHOTOCARDS
             ================================================= -->

        <div class="photocards">

            <!-- PHOTOCARD 1 -->

            <div class="photocard">
                <img src="photocard1.png" alt="Rosalinda">
            </div>

            <div class="photocard">
                <img src="photocard2.png" alt="Rosalinda">
            </div>


        </div>


        <!-- =================================================
             FRASE
             ================================================= -->

        <p class="frase">

            Ven a celebrar conmigo

            <span>mi cumpleaños número...</span>

        </p>


        <!-- =================================================
             NÚMERO 2
             ================================================= -->

        <div class="numero-container">
            <div style="font-size: 150px;">
                <img src="numero2.png" class="numero" alt="Número 2">
            </div>
        </div>


        <!-- =================================================
             INFORMACIÓN
             ================================================= -->

        <section class="informacion">


            <!-- FECHA -->

            <div class="dato">

                <div class="dato-icono">
                    📅
                </div>
                <div class="dato-texto">
                    <div class="dato-titulo">
                        Día
                    </div>
                    <div class="dato-info">
                        Sábado 17 de octubre
                    </div>
                </div>
            </div>


            <!-- HORA -->

            <div class="dato">
                <div class="dato-icono">
                    🕐
                </div>
                <div class="dato-texto">
                    <div class="dato-titulo">
                        Hora
                    </div>
                    <div class="dato-info">
                        16:30 horas
                    </div>
                </div>
            </div>

            <!-- LUGAR -->

            <div class="dato">
                <div class="dato-icono">
                    📍
                </div>
                <div class="dato-texto">
                    <div class="dato-titulo">
                        Lugar
                    </div>
                    <div class="dato-info">
                        Calle Molina Lavín 01642 Quinta Normal
                    </div>
                    <a href="https://www.google.com/maps/place/Molina+Lav%C3%ADn+01642,+8500034+Santiago,+Quinta+Normal,+Regi%C3%B3n+Metropolitana/@-33.4300128,-70.7098927,19z/data=!4m6!3m5!1s0x9662c40c6a4dbf3d:0x337af4ab3539e444!8m2!3d-33.4299848!4d-70.7095869!16s%2Fg%2F11l76vk7w8?entry=tts&g_ep=EgoyMDI1MDkyNC4wIPu8ASoASAFQAw%3D%3D&skid=f7537fc8-80de-4f96-899a-71cea2532618"
                        class="boton-mapa">
                        📍 Ver ubicación
                    </a>
                </div>
            </div>
        </section>


        <!-- =================================================
             imagen FINAL
             ================================================= -->

        <div class="imagen-final">

            <img src="teesperamos.png" alt="Te esperamos">

        </div>
        <!-- =================================================
             DECORACIÓN INFERIOR
             ================================================= -->

        <div class="decoracion-inferior">
            🌷 🦋 🌷
        </div>


    </main>

    <script>

    const musica = document.getElementById("musica");
    const botonMusica = document.getElementById("boton-musica");

    let reproduciendo = false;


    botonMusica.addEventListener("click", () => {

        if (reproduciendo) {

            musica.pause();

            botonMusica.textContent = "🔇";

            reproduciendo = false;

        } else {

            musica.play();

            botonMusica.textContent = "🎵";

            reproduciendo = true;

        }

    });


    // Intentar reproducir automáticamente
    window.addEventListener("load", () => {

        musica.volume = 0.5;

        musica.play()
            .then(() => {

                reproduciendo = true;

                botonMusica.textContent = "🎵";

            })
            .catch(() => {

                // El navegador bloqueó el autoplay.
                // La música comenzará al tocar el botón.

                reproduciendo = false;

                botonMusica.textContent = "🔇";

            });

    });

</script>

</body>

</html>
